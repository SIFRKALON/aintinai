<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3e2">
<title>Aintinai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: the toy-box map fills the screen; cream paper HUD and sheet float on it, inked in navy with kolam-dot trim. */
:root {
  --paper: #fff7ec; --paper-2: #ffeedd; --ink: #2b2a5c; --pink: #ff5d9e; --sun: #ffd23f; --sky: #3aa8e0; --leaf: #3cc46a;
  --muted: #6c6895; --line: #2b2a5c;
  --display: 'Baloo Thambi 2', 'Catamaran', system-ui, sans-serif; --body: 'Baloo Thambi 2', 'Catamaran', system-ui, -apple-system, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --kolam: radial-gradient(circle, var(--pink) 1.4px, transparent 1.9px) 0 0 / 12px 6px repeat-x;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #3aa9e0; color: var(--ink); overflow: hidden; font-family: var(--body); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 620px; margin: 0 auto; overflow: hidden; background: #2f97d6; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-wrap: balance; }
.nod, .sc-nod { color: var(--muted); font-size: 12.5px; }
.nod i, .sc-nod i { font-style: normal; font-weight: 700; color: var(--pink); }

#mapwrap { position: absolute; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

/* HUD */
#hud { position: absolute; z-index: 5; left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); top: calc(8px + var(--safe-t));
  display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 5px; border-radius: 22px;
  background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.medal { width: 42px; height: 42px; border-radius: 50%; flex: none; background: #bfe8ff; border: 2.5px solid var(--ink); display: grid; place-items: center; }
.medal svg { width: 32px; height: 32px; }
.hud-text { flex: 1 1 auto; min-width: 0; }
.hud-text .sn { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-text .st { font-size: 12.5px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
.chip { display: flex; align-items: center; gap: 3px; height: 38px; padding: 0 8px; border-radius: 14px; background: #fff; border: 2px solid var(--ink);
  font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip small { color: #1f9c55; font-weight: 800; font-size: 12px; }
.iconbtn { width: 38px; height: 38px; border-radius: 14px; background: var(--sun); border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

#mapBtns { position: absolute; z-index: 4; right: calc(12px + var(--safe-r)); top: calc(76px + var(--safe-t)); display: flex; flex-direction: column; gap: 9px; }
#mapBtns button { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  display: grid; place-items: center; font-size: 24px; font-weight: 800; line-height: 1; color: var(--ink); }
#mapBtns button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#mapBtns svg { width: 22px; height: 22px; }

#banner { position: absolute; z-index: 6; left: 50%; top: calc(78px + var(--safe-t)); transform: translateX(-50%); padding: 6px 16px 5px; border-radius: 999px;
  background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: 15px; white-space: nowrap; display: none; }
#banner.show { display: block; animation: pop .3s ease-out; }
#banner small { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 600; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -6px) scale(.9); } }

#toasts { position: absolute; z-index: 6; left: calc(12px + var(--safe-l)); right: 66px; top: calc(78px + var(--safe-t)); display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
.toast { align-self: flex-start; max-width: 100%; padding: 6px 12px 5px; border-radius: 14px; background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 0 3px 0 var(--ink); font-size: 14.5px; font-weight: 600; line-height: 1.3; animation: tin .25s ease-out; transition: opacity .4s; }
.toast.good { background: #e3ffe9; } .toast.bad { background: #ffe3ec; }
@keyframes tin { from { transform: translateY(-6px) scale(.95); opacity: 0; } }

/* command sheet */
#panel { position: absolute; z-index: 5; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); display: flex; gap: 10px; align-items: stretch;
  padding: 16px 12px 12px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 var(--ink); max-height: 46vh; }
#panel::before { content: ''; position: absolute; left: 26px; right: 26px; top: 6px; height: 6px; background: var(--kolam); opacity: .8; }
#info { flex: 1 1 auto; min-width: 0; overflow-y: auto; font-size: 15px; line-height: 1.35; }
#turnBtns { flex: none; width: 96px; display: flex; flex-direction: column; gap: 8px; }
#nextBtn { border-radius: 18px; background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: 16px; padding: 7px 8px; display: flex; align-items: center; justify-content: center; gap: 7px; }
#nextBtn b { min-width: 22px; height: 22px; border-radius: 11px; background: var(--pink, #ff8fb1); color: #fff; font-size: 13px; line-height: 22px; padding: 0 5px; }
#nextBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#nextBtn.none { opacity: .45; }
#endBtn { flex: 1 1 auto; width: 96px; border-radius: 22px; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.05;
  background: var(--sun); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); padding: 10px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; }
#endBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#endBtn small { font-weight: 700; font-size: 12px; color: #6a5300; }
#endBtn:disabled { filter: grayscale(.7); opacity: .7; }
#endBtn.ready { animation: wiggle 2.4s ease-in-out infinite; background: #ffe066; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-3deg); } 90% { transform: rotate(3deg); } 95% { transform: rotate(-2deg); } }
.ihead { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
.ihead img, .ihead .sw { width: 42px; height: 46px; object-fit: contain; flex: none; }
.ihead h3 { margin: 0; font-size: 21px; line-height: 1.05; }
.ihead .ta { color: var(--muted); font-size: 13px; }
.ihead .hp { margin-left: auto; text-align: right; font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap; }
.hpbar { display: block; width: 64px; height: 9px; border-radius: 5px; background: #fff; border: 2px solid var(--ink); margin-top: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; }
.sub { color: var(--muted); font-size: 14px; }
.warn { color: #d2452f; font-size: 14px; font-weight: 600; }
.goodt { color: #1f9c55; font-size: 14px; font-weight: 600; }
.hint { font-size: 15px; padding-top: 2px; }
.hint b { color: var(--pink); }
.stats { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 3px 0 4px; }
.stats span { background: #fff; border: 1.5px solid var(--ink); border-radius: 10px; padding: 0 7px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 5px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; display: inline-block; }
.pips i.on { background: var(--sun); }
.acts { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 6px; scrollbar-width: none; }
.acts::-webkit-scrollbar { display: none; }
.act { flex: none; width: 84px; padding: 6px 6px 7px; border-radius: 18px; background: #fff; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 13.5px; font-weight: 800; line-height: 1.15; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.act img { width: 42px; height: 46px; object-fit: contain; }
.act .cost { color: #c24a00; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.act .why { color: var(--muted); font-weight: 600; font-size: 10.5px; text-align: center; }
.act:disabled { opacity: .5; box-shadow: none; transform: translateY(2px); }
.act.wide { width: 130px; }
.acts.stack { flex-wrap: wrap; overflow: visible; }
.acts.stack .act.wide { width: calc(50% - 4px); min-width: 128px; flex: 1 1 128px; }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  background: rgba(43, 42, 92, 0.35); padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); }
.overlay.show { display: flex; animation: fin .25s ease-out; }
@keyframes fin { from { opacity: 0; } }
.card { position: relative; width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 28px; padding: 22px 20px 18px;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); animation: bounce .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bounce { from { transform: scale(.85); } }
.card h2 { margin: 2px 0 6px; font-size: 27px; line-height: 1.1; }
.card p { margin: 6px 0; line-height: 1.42; }
.btn { display: block; width: 100%; padding: 12px; border-radius: 18px; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 19px; margin-top: 14px;
  background: var(--sun); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: #fff; font-size: 15px; padding: 10px 6px; }
.row { display: flex; gap: 8px; } .row .btn { flex: 1; }

#seasonCard .card { padding: 0 0 18px; text-align: center; overflow: hidden; }
.sc-art { display: block; height: 128px; border-bottom: 3px solid var(--ink); overflow: hidden; }
.sc-art svg { width: 100%; height: 100%; display: block; }
.sc-body { padding: 0 20px; }
.sc-turn { color: var(--muted); font-size: 13px; margin-top: 12px; font-variant-numeric: tabular-nums; font-weight: 600; }
.sc-name { font-size: 34px !important; margin: 0 0 2px !important; }
.sc-strength { font-weight: 800; color: #c24a00; }
.sc-news { text-align: left; margin: 12px 0 0; padding: 10px 14px; background: #fff; border: 2px solid var(--ink); border-radius: 16px; list-style: none; font-size: 15px; line-height: 1.35; }
.sc-news li + li { margin-top: 5px; }
.sc-news:empty { display: none; }
.sc-nod { margin-top: 10px; }
.sc-music { margin-top: 4px; color: var(--muted); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sc-music svg { width: 15px; height: 15px; }

/* title over the living map */
#title { background: linear-gradient(180deg, rgba(255,247,236,0) 0%, rgba(255,247,236,0) 36%, rgba(255,247,236,0.0) 40%); align-items: stretch; overflow-y: auto; padding: calc(16px + var(--safe-t)) 12px calc(12px + var(--safe-b)); }
#title .inner { width: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; min-height: 100%; }
.t-head { text-align: center; padding-top: 6px; }
.t-en { font-size: 58px; line-height: .95; margin: 0; color: var(--pink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); letter-spacing: .01em; }
.t-sub { display: inline-block; margin-top: 10px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 14px 2px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
.t-sheet { background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 var(--ink); padding: 18px 14px 12px; position: relative; text-align: center; }
.t-sheet::before { content: ''; position: absolute; left: 30px; right: 30px; top: 7px; height: 6px; background: var(--kolam); opacity: .8; }
.t-lede { margin: 2px auto 12px; font-size: 15.5px; line-height: 1.38; max-width: 36ch; font-weight: 600; }
.houses { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.house { padding: 8px 10px 10px; border-radius: 20px; display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center;
  background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform .12s; }
.house:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.house img { grid-row: span 2; width: 46px; height: 54px; object-fit: contain; }
.house b { font-family: var(--display); font-size: 21px; line-height: 1; color: var(--ink); text-decoration: underline; text-decoration-color: var(--hc); text-decoration-thickness: 4px; text-underline-offset: 3px; }
.house .home { color: var(--muted); font-size: 12.5px; line-height: 1.2; }
.house .edge { grid-column: 1 / -1; font-size: 13.5px; line-height: 1.3; margin-top: 4px; font-weight: 600; }
.t-foot { color: var(--muted); font-size: 13px; margin: 10px 0 0; font-weight: 600; }
.rivals-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 14px; margin-top: 14px; font-weight: 700; }
.seg { display: inline-flex; background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 3px; }
.seg button { padding: 5px 13px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--pink); color: #fff; }

.help ol { padding-left: 20px; margin: 8px 0; }
.help li { margin: 7px 0; line-height: 1.4; font-size: 15px; }
.lands { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; font-size: 14px; margin: 10px 0; align-items: center; line-height: 1.3; }
.sw { width: 26px; height: 26px; }
.menu-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 4px; border-bottom: 2px dashed rgba(43,42,92,.2); font-size: 17px; font-weight: 700; text-align: left; }
.menu-item:last-of-type { border-bottom: 0; }
.toggle { width: 48px; height: 28px; border-radius: 14px; background: #ddd8ee; border: 2px solid var(--ink); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); box-sizing: border-box; transition: left .2s; }
.toggle.on { background: var(--leaf); } .toggle.on::after { left: 22px; }
.standings { width: 100%; border-collapse: collapse; font-size: 16px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.standings td { padding: 8px 4px; border-bottom: 2px dashed rgba(43,42,92,.15); }
.standings td.n { text-align: right; font-weight: 800; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; border: 2px solid var(--ink); }
.bars { margin: 12px 0 4px; }
.bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 15px; font-weight: 700; }
.bar .lab { width: 66px; text-align: left; }
.bar .track { flex: 1; height: 16px; background: #fff; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; }
.bar .fill { display: block; height: 100%; }
.bar .num { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.big { font-size: 40px !important; margin: 4px 0 0 !important; }
.portrait { width: 84px; height: 98px; object-fit: contain; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.growbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; font-weight: 700; }
.growbar .seeds { display: flex; gap: 4px; }
.growbar .seeds i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
.growbar .seeds i.on { background: var(--leaf); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.growbar .sub { margin: 0; font-weight: 600; }

#hudRank { font-size: 11px; font-weight: 800; color: #1f9c55; margin-left: 2px; }
#seasonToast { position: absolute; z-index: 6; left: 12px; right: 12px; top: calc(74px + var(--safe-t)); display: flex; gap: 10px; align-items: center; text-align: left;
  padding: 9px 12px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink); color: var(--ink);
  transform: translateY(-130%); opacity: 0; transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .25s; pointer-events: none; font: inherit; }
#seasonToast.show { transform: none; opacity: 1; pointer-events: auto; }
#seasonToast svg { flex: none; width: 38px; height: 38px; border-radius: 50%; background: #eaf4ff; border: 2px solid var(--ink); }
#seasonToast.dry svg { background: #fff1dc; }
#seasonToast .st-t { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; }
#seasonToast .st-t small { font-family: inherit; font-weight: 700; font-size: 13px; color: #6b6a95; margin-left: 6px; }
#seasonToast ul { list-style: none; margin: 2px 0 0; padding: 0; font-size: 13.5px; line-height: 1.3; font-weight: 600; }
#seasonToast .more { font-size: 12px; color: #6b6a95; }
.steps { margin: 2px 0 6px; padding: 0; list-style: none; font-size: 14.5px; line-height: 1.5; }
.steps li { display: flex; gap: 8px; align-items: center; }
.steps li i { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
.steps li.done { color: #8a89a8; text-decoration: line-through; }
.steps li.done i { background: var(--leaf); box-shadow: inset 0 0 0 2px #fff; }
.steps-h { font-family: var(--display); font-weight: 800; font-size: 16px; }

#rewardCard .card { text-align: center; padding: 18px 16px 16px; }
.rw-top { display: flex; justify-content: center; margin: -4px 0 2px; }
.rw-top img { height: 86px; image-rendering: auto; animation: rwbob 2.4s ease-in-out infinite; }
@keyframes rwbob { 50% { transform: translateY(-4px); } }
.rw-h { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 4px 0 2px; }
.rw-sub { color: var(--muted); font-size: 14.5px; margin-bottom: 12px; }
.rw-opts { display: flex; flex-direction: column; gap: 10px; }
.rw-opt { display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border: 2.5px solid var(--ink); border-radius: 20px;
  box-shadow: 0 4px 0 var(--ink); padding: 10px 12px; color: var(--ink); font: inherit; }
.rw-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.rw-opt svg, .rw-opt img { flex: none; width: 58px; height: 52px; object-fit: contain; }
.rw-opt b { font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; }
.rw-opt .nod { display: block; }
.rw-opt span.d { display: block; font-size: 14px; line-height: 1.3; margin-top: 2px; }
.perks { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.perks span { font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #fff3d6; border: 1.6px solid var(--ink); }
.pact { font-size: 12px; font-weight: 800; color: #fff; background: #d2452f; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
.pact.ally { background: #2fa85a; }

#techBtn { position: relative; }
#techBtn svg { width: 26px; height: 26px; }
#techDot { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: #ff5d9e; border: 2px solid var(--ink); display: none; }
#techBtn.can #techDot { display: block; }
#techCard .card { max-height: 86vh; overflow-y: auto; padding: 16px 14px; }
.tk-h { font-family: var(--display); font-weight: 800; font-size: 24px; text-align: center; }
.tk-sub { text-align: center; color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
.tk-row-h { font-weight: 800; font-size: 13px; color: var(--muted); margin: 10px 2px 6px; }
.tk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tk { text-align: left; border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 10px; background: #fff; color: var(--ink); font: inherit; box-shadow: 0 3px 0 var(--ink); }
.tk b { font-family: var(--display); font-size: 16.5px; display: block; line-height: 1.15; }
.tk .nod { font-size: 12px; }
.tk .d { display: block; font-size: 12.5px; line-height: 1.25; margin-top: 3px; }
.tk .c { display: inline-block; margin-top: 5px; font-weight: 800; font-size: 13px; padding: 1px 8px; border-radius: 9px; background: #ffe58a; border: 1.6px solid var(--ink); }
.tk.known { background: #e3f6dc; box-shadow: none; }
.tk.known .c { background: #7ee08f; }
.tk.locked { opacity: .55; box-shadow: none; }
.tk.poor .c { background: #eee; }
.tk.wide { grid-column: span 2; }
.tk:active:not(.known):not(.locked) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.counter { font-size: 13px; margin: 3px 0; }

.act.locked { opacity: .6; filter: grayscale(.4); }

/* ---- mobile-first command sheet: full-width info, big buttons, turn bar along the bottom ---- */
#panel { flex-direction: column; gap: 8px; max-height: 52vh; padding: 16px 12px 10px; }
#info { font-size: 16px; line-height: 1.38; }
#turnBtns { width: auto; flex-direction: row; gap: 8px; flex: none; }
#nextBtn { flex: 0 0 38%; min-height: 54px; font-size: 19px; border-radius: 20px; }
#nextBtn b { min-width: 26px; height: 26px; line-height: 26px; font-size: 15px; border-radius: 13px; }
#endBtn { flex: 1 1 auto; width: auto; min-height: 54px; flex-direction: row; gap: 10px; font-size: 21px; padding: 8px 14px; }
#endBtn small { font-size: 13px; }
.acts, .acts.stack { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow: visible; padding: 8px 0 4px; }
.act, .act.wide, .acts.stack .act.wide { width: auto; min-width: 0; min-height: 66px; display: grid; grid-template-columns: auto 1fr; grid-auto-rows: min-content;
  align-content: center; column-gap: 8px; row-gap: 1px; text-align: left; padding: 8px 10px; font-size: 15.5px; border-radius: 18px; }
.act > img, .act > svg { grid-row: span 3; width: 44px; height: 46px; align-self: center; }
.act > span { grid-column: 2; }
.act .cost { font-size: 14px; }
.act .why { font-size: 12.5px; text-align: left; line-height: 1.2; }
.ihead img { width: 50px; height: 54px; }
.ihead h3 { font-size: 23px; }
.stats { font-size: 14px; }
.stats span { padding: 1px 8px; }
#mapBtns { gap: 10px; }
#mapBtns button { width: 48px; height: 48px; }
#mapBtns svg { width: 25px; height: 25px; }
#techBtn svg { width: 30px; height: 30px; }
#techBtn { width: 56px !important; height: 56px !important; background: #ffe58a !important; }
.hud-pill small.cap { font-size: 11px; color: var(--muted); font-weight: 700; margin-left: 1px; }

/* ---- the skill ladder ---- */
#techCard .card { padding: 18px 12px 14px; }
.lad { position: relative; height: 372px; margin: 6px 0 4px; }
.lad svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lad .tier { position: absolute; left: 0; font-size: 11.5px; font-weight: 800; color: var(--muted); }
.node { position: absolute; width: 25%; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; font: inherit; color: var(--ink); transform: translateX(-50%); }
.node .orb { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--ink); position: relative; }
.node .orb svg { width: 42px; height: 42px; }
.node .nm { font-family: var(--display); font-weight: 800; font-size: 13.5px; line-height: 1.05; text-align: center; margin-top: 3px; }
.node .ct { font-size: 12px; font-weight: 800; padding: 0 7px; border-radius: 8px; background: #ffe58a; border: 1.5px solid var(--ink); }
.node.known .orb { background: #c9f2c2; box-shadow: 0 2px 0 var(--ink); }
.node.known .ct { background: #7ee08f; }
.node.ok .orb { background: #fff3c4; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 7px rgba(255, 210, 63, .45); } }
.node.locked .orb, .node.poor .orb { background: #efeaf6; border-style: dashed; box-shadow: none; }
.node.locked svg, .node.poor svg { opacity: .45; filter: grayscale(1); }
.node.locked .ct, .node.poor .ct { background: #eee; }
.node.sel .orb { outline: 4px solid var(--pink); outline-offset: 3px; }
.node.known .orb::after { content: '✓'; position: absolute; right: -6px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: #fff;
  font-weight: 900; font-size: 14px; display: grid; place-items: center; border: 2px solid var(--ink); }
.node.cap .orb { width: 80px; height: 80px; background: #ffe7f1; }
.node.cap .orb svg { width: 54px; height: 54px; }
.tk-detail { border: 2.5px solid var(--ink); border-radius: 20px; background: #fff; padding: 12px 14px; margin-top: 4px; min-height: 120px; }
.tk-detail h4 { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.1; }
.tk-detail .d { font-size: 15px; margin: 4px 0 2px; }
.tk-detail .btn { margin-top: 10px; }
.tk-detail .btn:disabled { opacity: .5; }

#endBtn span { white-space: nowrap; }
.lad { height: 396px; }

/* a ruler speaks */
#court { position: absolute; z-index: 7; left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; text-align: left;
  padding: 8px 12px 8px 8px; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 0 4px 0 var(--ink); color: var(--ink); font: inherit;
  transform: translateY(16px) scale(.96); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.2,1.4,.4,1), opacity .2s; }
#court.show { transform: none; opacity: 1; pointer-events: auto; }
#court img { flex: none; width: 64px; height: 64px; }
#court .who { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1.1; }
#court .who small { font-family: var(--body); font-weight: 700; font-size: 12px; color: var(--muted); margin-left: 4px; }
#court .say { font-size: 16px; line-height: 1.3; font-weight: 600; margin-top: 2px; }
#court::after { content: ''; position: absolute; left: 40px; bottom: -11px; width: 18px; height: 18px; background: #fff; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(45deg); }
/* the parrot coach */
#coach { position: absolute; z-index: 7; left: 10px; right: 10px; display: none; gap: 10px; align-items: center; padding: 8px 12px 8px 8px;
  background: #e9fbe4; border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 0 4px 0 var(--ink); font-size: 16px; line-height: 1.3; font-weight: 600; pointer-events: none; }
#coach.show { display: flex; animation: tin .3s; }
#coach svg { flex: none; width: 56px; height: 56px; }
#coach b { color: var(--pink); }
.pulse-me { animation: pulseme 1.1s ease-in-out infinite !important; }
@keyframes pulseme { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 8px rgba(255, 93, 158, .45); } }
/* courts */
.courtrow { display: flex; gap: 10px; align-items: center; padding: 10px; border: 2.5px solid var(--ink); border-radius: 20px; background: #fff; margin-top: 10px; }
.courtrow img { width: 70px; height: 70px; flex: none; }
.courtrow .nm { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; }
.courtrow .tp { font-size: 13px; color: var(--muted); font-weight: 700; }
.courtrow .md { display: inline-block; margin-top: 3px; font-size: 13px; font-weight: 800; padding: 1px 8px; border-radius: 9px; border: 1.6px solid var(--ink); }
.md.friendly { background: #7ee08f; } .md.warm { background: #c9f2c2; } .md.wary { background: #ffe58a; } .md.hostile { background: #ff9a8a; }
.courtrow .gift { margin-left: auto; flex: none; border: 2.5px solid var(--ink); border-radius: 16px; background: var(--sun); box-shadow: 0 3px 0 var(--ink);
  font: inherit; font-weight: 800; font-size: 14px; padding: 8px 10px; color: var(--ink); line-height: 1.1; }
.courtrow .gift:disabled { opacity: .5; box-shadow: none; }
.courtrow.fallen { opacity: .5; }

.tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 4px; }
.tally div { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 6px 4px; text-align: center; }
.tally b { display: block; font-family: var(--display); font-size: 20px; line-height: 1; }
.tally span { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.1; display: block; margin-top: 2px; }
.tale { text-align: left; background: #fffdf6; border: 2px dashed #d8c38a; border-radius: 16px; padding: 8px 12px; margin: 8px 0; max-height: 26vh; overflow-y: auto; }
.tale-h { font-family: var(--display); font-weight: 800; font-size: 16px; margin-bottom: 2px; }
.tale p { margin: 3px 0; font-size: 14px; line-height: 1.3; }
.courtrow .say { font-size: 14.5px; line-height: 1.3; margin-top: 2px; }

/* small, always-reachable close button on every sheet */
.xclose { position: sticky; top: 0; float: right; margin: -6px -4px 0 8px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; padding: 0;
  background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; }
.xclose svg { width: 18px; height: 18px; }
.xclose:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#tkClose, #sClose, #mClose, #helpClose { display: none !important; }

.lad { height: 410px; margin: 8px -4px 6px; }
.node .nm { text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.tk-h { font-size: 26px; }

.landmark { margin: 6px 0; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 14px; background: #fff7d6; font-size: 14.5px; line-height: 1.35; }

/* compact bottom sheet: only what you need, only while you need it */
#panel.bare { padding: 8px; gap: 0; }
#panel.bare::before, #panel.bare #info { display: none; }
#panel.bare #turnBtns > * { min-height: 50px; }
#panel:not(.more) #info :is(.stats, .counter:not(.keep), .sub, .goodt, .landmark, .perks, .growbar, .nod, .steps-h, .steps) { display: none; }
#panel:not(.more) #info .act:not([disabled]):not(.locked) .why { display: none; }
#panel:not(.more) #info .hint ~ .hint { display: none; }
#panel:not(.more) #info .act.locked, #panel:not(.more) #info .city-hint { display: none; }
#panel:not(.more) #info .acts, #panel:not(.more) #info .acts.stack { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 6px 0 2px; }
#panel:not(.more) #info .act, #panel:not(.more) #info .act.wide { min-height: 0; padding: 4px 8px 5px; border-radius: 14px; box-shadow: 0 2px 0 var(--ink); }
#panel:not(.more) #info .act > img, #panel:not(.more) #info .act > svg { grid-row: span 2; width: 30px; height: 32px; }
#panel:not(.more) #info .act:disabled .why { font-size: 11px; }
#panel { max-height: 40vh; }
#panel.more { max-height: 60vh; }
.ihead { position: relative; padding-right: 34px; }
.more-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--ink); background: #fff; font: 800 15px/1 var(--display); color: var(--ink); display: grid; place-items: center; }
.ihead .hp { margin-right: 4px; }
#coach { font-size: 14.5px; }

</style>
</head>
<body>
<div id="app">
  <div id="mapwrap"><canvas id="map" aria-label="Map of the five lands"></canvas></div>

  <header id="hud">
    <button id="seasonBtn" class="medal" aria-label="Season details"><svg id="hudWind" viewBox="0 0 40 40"></svg></button>
    <div class="hud-text"><div class="sn" id="hudSeason">West Monsoon</div><div class="st" id="hudSub">kodai</div></div>
    <button class="chip" id="riceStat" aria-label="Rice">
      <svg viewBox="0 0 20 20"><path d="M10 18.5V6M10 10.2c-3-.8-5-3-5-6.2 3 0 5 2.2 5 6.2zM10 10.2c3-.8 5-3 5-6.2-3 0-5 2.2-5 6.2zM10 14.6c-3-.8-5-2.6-5-5.2 3 0 5 2 5 5.2zM10 14.6c3-.8 5-2.6 5-5.2-3 0-5 2-5 5.2z" fill="#f0c45a" stroke="#f0c45a" stroke-width="1" stroke-linejoin="round"/></svg>
      <b id="hudRice">5</b><small id="hudInc">+3</small>
    </button>
    <button class="chip" id="landStat" aria-label="Standings">
      <svg viewBox="0 0 20 20"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z" fill="rgba(92,194,138,.25)" stroke="#5cc28a" stroke-width="2"/></svg>
      <b id="hudLand">7</b><small id="hudRank">1st</small>
    </button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="#2b2a5c" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </header>

  <div id="mapBtns">
    <button id="techBtn" aria-label="Learn new skills"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="#f5d98b" stroke="#2b2a5c" stroke-width="1.8"/><path d="M6 10.5h12M6 13.5h9" stroke="#a8742c" stroke-width="1.4" stroke-linecap="round"/><circle cx="3.5" cy="12" r="1.6" fill="#c98a4b" stroke="#2b2a5c" stroke-width="1.2"/><circle cx="20.5" cy="12" r="1.6" fill="#c98a4b" stroke="#2b2a5c" stroke-width="1.2"/></svg><i id="techDot"></i></button>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">&minus;</button>
    <button id="soundBtn" aria-label="Sound on or off"></button>
    <button id="homeBtn" aria-label="Center on your capital"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" fill="none" stroke="#2b2a5c" stroke-width="2"/><circle cx="10" cy="10" r="2" fill="#2b2a5c"/><path d="M10 1v3M10 16v3M1 10h3M16 10h3" stroke="#2b2a5c" stroke-width="2"/></svg></button>
  </div>
  <div id="banner"></div>
  <button id="seasonToast" aria-label="Season news. Tap for details"></button>
  <button id="court" aria-label="A ruler speaks. Tap to close"></button>
  <div id="coach"></div>
  <div id="toasts"></div>

  <section id="panel">
    <div id="info"></div>
    <div id="turnBtns">
      <button id="nextBtn" aria-label="Go to the next unit that can move"><span>Next</span><b>0</b></button>
      <button id="endBtn"><span>End turn</span><small id="endSub">3 units ready</small></button>
    </div>
  </section>

  <div class="overlay show" id="title">
    <div class="inner">
      <div class="t-head">
        <h1 class="t-en">Aintinai</h1>
        <div class="t-sub">a tiny kingdom game · <span lang="ta">ஐந்திணை</span>, the five lands</div>
      </div>
      <div class="t-sheet">
        <p class="t-lede">Grow your kingdom across old South India and Lanka. Follow the rains, take villages, and hold the most land after 30 seasons.</p>
        <div class="houses" id="houseList"></div>
        <div class="rivals-wrap"><span>Rivals</span><div class="seg" id="rivals"></div></div>
        <div class="row">
          <button class="btn ghost" id="continueBtn" style="display:none">Continue</button>
          <button class="btn ghost" id="howBtn">How to play</button>
          <button class="btn ghost" id="soundCheck">Sound check</button>
        </div>
        <p class="t-foot">Pick a house to start.</p>
      </div>
    </div>
  </div>

  <div class="overlay" id="seasonCard"><div class="card" id="seasonInner"></div></div>
  <div class="overlay" id="techCard"><div class="card" id="techInner"></div></div>
  <div class="overlay" id="rewardCard"><div class="card" id="rewardInner"></div></div>
  <div class="overlay" id="help"><div class="card help" id="helpInner"></div></div>
  <div class="overlay" id="menu"><div class="card" id="menuInner"></div></div>
  <div class="overlay" id="endCard"><div class="card" id="endInner" style="text-align:center"></div></div>
</div>
<script>
/* Aintinai — game engine (no DOM). Plain JSON state so it can be saved. */
var Engine = (function () {
  'use strict';

  // ---------------------------------------------------------------- config
  var CFG = {
    W: 16, H: 32,
    maxTurns: 30,
    rainReachMin: 4, rainReachMax: 9,  // tiles inland a monsoon reaches (varies each year)
    dryToPalai: 4,                       // seasons without water before land turns to wasteland (checked in the hot season)
    palaiDamage: 2,                      // health lost per turn standing in wasteland
    healRest: 2, healHome: 4,
    startRice: 6,
    growCost: 5, maxLevel: 5,            // grow cost = growCost * level
    tankCost: 5, tankCostLanka: 3, tankLevelNeeded: 2, tankMax: 3,
    raiderMax: 6, raiderChance: 0.5, raiderLoot: 3, raiderSteal: 3,
    villages: 8,
    sight: 2,
    yieldDiv: 3                          // city makes level + floor(land yield / yieldDiv)
  };

  var LANDS = {
    sea:     { name: 'kadal', en: 'Sea', ta: 'கடல்' },
    shoal:   { name: 'manal', en: 'Sandbar', ta: 'மணல்' },
    kurinji: { name: 'kurinji', en: 'Blue Hills', ta: 'குறிஞ்சி', gives: 'Elephants live here. Good for defending. Rain stops at the hills.' },
    mullai:  { name: 'mullai', en: 'Woods', ta: 'முல்லை', gives: 'Cows and jasmine. Unlocks herders.' },
    marutam: { name: 'marutam', en: 'Paddy Fields', ta: 'மருதம்', gives: 'The most rice, as long as it has water.' },
    neytal:  { name: 'neytal', en: 'Beach', ta: 'நெய்தல்', gives: 'Fish and boats. Unlocks rafts and ships.' },
    palai:   { name: 'palai', en: 'Badlands', ta: 'பாலை', gives: 'Too dry to grow anything. Units here get thirsty.' }
  };

  var UNITS = {
    warrior:  { name: 'Warrior',  cost: 3,  atk: 2, def: 2, hp: 10, move: 2, range: 1, needs: null },
    herder:   { name: 'Herder',   cost: 5,  atk: 1, def: 1, hp: 8,  move: 3, range: 1, tech: 'herding' },
    archer:   { name: 'Archer',   cost: 4,  atk: 2, def: 1, hp: 10, move: 2, range: 2, tech: 'archery', hillWalker: true },
    elephant: { name: 'Elephant', cost: 8,  atk: 4, def: 3, hp: 20, move: 2, range: 1, tech: 'elephants', siege: true },
    raft:     { name: 'Raft',     cost: 4,  atk: 1, def: 1, hp: 8,  move: 3, range: 1, tech: 'fishing', naval: 'shallow' },
    ship:     { name: 'Ship',     cost: 7,  atk: 3, def: 2, hp: 14, move: 4, range: 2, tech: 'seafaring', naval: 'any' },
    yali:     { name: 'Yali',     cost: 0,  atk: 5, def: 4, hp: 30, move: 2, range: 1, hillWalker: true, palaiImmune: true, mythic: true },
    raider:   { name: 'Raider',   cost: 0,  atk: 2, def: 1, hp: 8,  move: 2, range: 1, palaiImmune: true }
  };
  var TRAINABLE = ['warrior', 'herder', 'archer', 'elephant', 'raft', 'ship'];
  // when a city grows, its people choose one of two gifts
  var REWARDS = {
    2: [{ k: 'market', name: 'Market day', nod: 'angadi', desc: '+1 rice every turn' },
        { k: 'bard', name: 'Wandering bard', nod: 'paanar', desc: 'Sings of far lands: see far around the city, and +4 rice' }],
    3: [{ k: 'walls', name: 'Fort walls', nod: 'aran', desc: 'The city defends twice as hard' },
        { k: 'borders', name: 'Wider borders', nod: 'ellai', desc: 'The city claims land 2 tiles out' }],
    4: [{ k: 'kulam', name: 'Temple tank', nod: 'kulam', desc: 'Waters the land around the city all year, and +1 rice every turn' },
        { k: 'gift', name: 'Gift elephant', nod: 'yaanai', desc: 'A war elephant joins you here, free' }],
    5: [{ k: 'yali', name: 'Wake the Yali', nod: 'yaali', desc: 'The temple guardian, a lion with a curling trunk, joins your army' },
        { k: 'festival', name: 'Grand festival', nod: 'vizhaa', desc: '+3 rice every turn, and room for 2 more units' }]
  };
  // things you build on your land; each one also helps its city grow
  var IMPS = {
    farm:    { name: 'Paddy farm',    on: 'marutam', cost: 5, tech: 'farming', gives: '+3 rice at each harvest, if the rains or a river reached it that year' },
    fishery: { name: 'Fishing boats', on: 'sea',     cost: 5, tech: 'fishing', gives: '+1 rice a turn in the dry seasons. Boats stay home in the monsoon' },
    camp:    { name: 'Elephant camp', on: 'kurinji', cost: 5, tech: 'elephants', gives: 'Elephants cost 2 less. Helps the city grow' },
    tank:    { name: 'Tank',          on: 'dry',     cost: 4, tech: 'irrigation', gives: 'Stores rain to keep the land next to it watered' },
    pasture: { name: 'Cow pasture',   on: 'mullai',  cost: 0, tech: 'herding', gives: '+1 rice a turn while the grass is green. Only a herder can set one up' }
  };

  var HOUSES = [
    { key: 'chera',  name: 'Chera',  emblem: 'bow',   color: '#ff4f5e', capital: 'Vanchi',
      home: 'West coast', edge: 'Hill archers: you start knowing Archery. Boats cost 2 less.' },
    { key: 'chola',  name: 'Chola',  emblem: 'tiger', color: '#ffb000', capital: 'Uraiyur',
      home: 'Eastern delta', edge: 'You start knowing Herding. Farms by a river also give 1 rice every turn.' },
    { key: 'pandya', name: 'Pandya', emblem: 'fish',  color: '#4f9dff', capital: 'Madurai',
      home: 'Far south', edge: 'You start knowing Fishing. Korkai’s pearl divers: boats bring in double, even in the monsoon.' },
    { key: 'lanka',  name: 'Lanka',  emblem: 'lion',  color: '#9b6bff', capital: 'Anuradhapura',
      home: 'The island', edge: 'Island folk: you start knowing Tanks and Fishing, and tanks cost 2 rice.' }
  ];

      }).join('') + '</table>' +
      (G.pact >= 0 ? '<p class="sub">' + (G.pact === G.player ? 'Every other house has sworn a pact against you. Shrink their lead on you, or hold on.' : 'The other houses, you included, have sworn a pact against ' + houseName(G.pact) + '. Pact members don’t attack each other.') + '</p>' :
        '<p class="sub">If one house pulls far ahead, the others swear a pact against it.</p>') +
      '<p class="sub">Territory: each land tile in your borders, plus half for each tile of shallow water.</p><button class="btn" id="sClose">Close</button>';
    show('menu');
    $('sClose').onclick = function () { hide('menu'); };
  }
  $('landStat').onclick = showCourts;
  $('riceStat').onclick = function () { if (G && !G.demo) toast('Rice: ' + G.houses[G.player].rice + ' of ' + E.granary(G, G.player) + ' your granaries hold. Cities make ' + E.income(G, G.player) + ' a turn. Extra rice spoils, so spend it.', ''); };

  function chronicle() {
    var me = G.player, out = [];
    (G.chron || []).forEach(function (c) {
      var who = function (h) { return h === me ? 'You' : rulerOf(h).name; };
      if (c.k === 'capture') {
        if (c.h === me) out.push([c.turn, 'You took ' + c.name + (c.capital ? ', the capital of ' + E.HOUSES[c.prev].name : '') + '.']);
        else if (c.prev === me) out.push([c.turn, rulerOf(c.h).name + ' took your city of ' + c.name + '.']);
        else if (c.capital) out.push([c.turn, rulerOf(c.h).name + ' took ' + c.name + ', capital of ' + E.HOUSES[c.prev].name + '.']);
      } else if (c.k === 'fall') out.push([c.turn, 'The house of ' + E.HOUSES[c.h].name + ' fell to ' + (c.by === me ? 'you' : E.HOUSES[c.by] ? E.HOUSES[c.by].name : 'raiders') + '.']);
      else if (c.k === 'pact') out.push([c.turn, c.h === me ? 'The other houses swore a pact against you.' : 'The houses swore a pact against ' + E.HOUSES[c.h].name + '.']);
      else if (c.k === 'yali') out.push([c.turn, who(c.h) + (c.h === me ? ' woke' : ' woke') + ' a Yali at ' + c.name + '.']);
      else if (c.k === 'sangam') out.push([c.turn, (c.h === me ? 'Poets gathered at your court' : 'Poets gathered at the court of ' + rulerOf(c.h).name) + ': the Sangam.']);
      else if (c.k === 'found') out.push([c.turn, 'Your herders founded ' + c.name + '.']);
    });
    return out.slice(-7);
  }
  function showEnd() {
    if (!G || !G.over) return;
    var h2 = '';
    var o = G.over, me = G.player, win = o.winner === me;
    var why = {
      capitals: win ? 'You hold every capital.' : houseName(o.winner) + ' took every capital.',
      last: win ? 'Every rival house has fallen.' : houseName(o.winner) + ' stands alone.',
      time: 'Thirty seasons have passed. ' + (win ? 'You hold the most territory.' : houseName(o.winner) + ' holds the most territory.'),
      eliminated: 'Your last city has fallen.'
    }[o.reason];
    var max = Math.max.apply(null, o.land.concat([1]));
    var bars = o.land.map(function (n, h) { return { n: n, h: h }; }).sort(function (a, b) { return b.n - a.n; }).map(function (b) {
      return '<div class="bar"><span class="lab">' + E.HOUSES[b.h].name + '</span><span class="track"><span class="fill" style="width:' +
        Math.round(100 * b.n / max) + '%;background:' + HC[b.h] + '"></span></span><span class="num">' + b.n + '</span></div>';
    }).join('');
    $('endInner').innerHTML = '<img class="portrait" alt="" src="' + A.figURL('warrior', HC[o.winner], o.winner, win ? 'love' : 'happy') + '">' +
      '<h2 class="big">' + (win ? 'You win!' : 'Good game!') + '</h2><div class="sc-nod">' + (win ? '<i>vetri</i> <span lang="ta">வெற்றி</span>, victory' : 'Try another house?') + '</div><p>' + why + '</p>' +
      '<div class="bars">' + bars + '</div><p class="sub">Land held at the end</p><button class="btn" id="againBtn">Play again</button>';
    // the story of your reign
    var st = G.stats ? G.stats[me] : null;
    if (st) {
      h2 = '<div class="tally">' + [['Territory', o.land[me]], ['Cities', G.cities.filter(function (c) { return c.owner === me; }).length], ['Foes defeated', st.kills],
        ['Cities taken', st.captured], ['Things built', st.built], ['Skills', st.learned], ['Feasts', st.feasts], ['Ruins searched', st.ruins]]
        .map(function (r) { return '<div><b>' + r[1] + '</b><span>' + r[0] + '</span></div>'; }).join('') + '</div>';
      var tale = chronicle();
      if (tale.length) h2 += '<div class="tale"><div class="tale-h">The chronicle of your reign</div>' + tale.map(function (x) { return '<p><b>Turn ' + x[0] + '.</b> ' + x[1] + '</p>'; }).join('') + '</div>';
      $('endInner').querySelector('.bars').insertAdjacentHTML('afterend', h2);
    }
    // the winner (or a rival) has the last word
    var speaker = win ? [0, 1, 2, 3].filter(function (x) { return x !== me && G.houses[x] && G.houses[x].alive; })[0] : o.winner;
    if (speaker != null && speaker !== me) $('endInner').insertAdjacentHTML('afterbegin', '<div class="courtrow" style="margin:0 0 10px">' + rulerImg(speaker, win ? 'calm' : 'happy') +
      '<div><div class="nm">' + rulerOf(speaker).name + '</div><div class="say">“' + esc(Voices.line(win ? 'lose' : 'win', E.temper(G, speaker), { me: houseName(me) })) + '”</div></div></div>');
    show('endCard');
    Mu.setMood(win ? 'victory' : 'defeat', true);
    if (win) {
      Mu.sfx.capture();
      G.cities.forEach(function (c, k) { if (c.owner === me) setTimeout(function () { fxAt(c.i, 'love', HC[me]); }, k * 120); });
    }
    clearSave();
    $('againBtn').onclick = function () { hide('endCard'); showTitle(); };
  }

  // ------------------------------------------------------------ title (over a living map) & game start
  function startDemo() {
    var g = E.newGame(20261117, 1);
    g.tiles.forEach(function (t) { t.exp = true; t.vis = true; });
    g.demo = true;
    setGame(g);
  }
  function setGame(g) {
    G = g; computeCenters();
    layer.width = Math.ceil(MAPW * LK); layer.height = Math.ceil(MAPH * LK);
    layerDirty = true; fogDirty = true; sel = null; opts = null; anims = []; parts = []; floaters = []; flashes = []; play = null; busy = false;
    resize();
  }
  function renderRivals() {
    $('rivals').innerHTML = ['Gentle', 'Fair', 'Fierce'].map(function (n, k) {
      return '<button data-r="' + k + '" class="' + (settings.rivals === k ? 'on' : '') + '">' + n + '</button>';
    }).join('');
  }
  $('rivals').addEventListener('click', function (e) {
    var b = e.target.closest('[data-r]'); if (!b) return;
    settings.rivals = +b.getAttribute('data-r'); saveSettings(); renderRivals(); Mu.sfx.tap();
  });
  function showTitle() {
    hideSeasonBanner();
    $('houseList').innerHTML = E.HOUSES.map(function (Hh, h) {
      return '<button class="house" data-h="' + h + '" style="--hc:' + Hh.color + '"><img alt="" src="' + A.figURL('warrior', Hh.color, h, 'happy') + '"><b>' + Hh.name + '</b>' +
        '<span class="home">' + Hh.home + ' · ' + Hh.capital + '</span><span class="edge">' + Hh.edge + '</span></button>';
    }).join('');
    $('continueBtn').style.display = loadSave() ? '' : 'none';
    renderRivals();
    ['hud', 'panel', 'mapBtns'].forEach(function (id) { $(id).style.visibility = 'hidden'; });
    $('banner').classList.remove('show');
    startDemo();
    show('title');
    if (Mu.started()) Mu.setMood('title');
  }
  $('houseList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-h]');
    if (!b) return;
    Mu.unlock();
    var g = E.newGame((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, +b.getAttribute('data-h'));
    E.setDifficulty(g, settings.rivals);
    startGame(g, true);
  });
  $('continueBtn').onclick = function () { Mu.unlock(); var s = loadSave(); if (s) startGame(s, false); else showTitle(); };
  $('title').addEventListener('pointerdown', function () { Mu.unlock(); if (!G || G.demo) Mu.setMood('title'); }, { once: true });

  function startGame(state, fresh) {
    hide('title'); hide('endCard');
    ['hud', 'panel', 'mapBtns'].forEach(function (id) { $(id).style.visibility = ''; });
    setGame(state);
    E.computeVis(G); computeReady(); renderHUD();
    var cap = G.cities.filter(function (c) { return c.capitalOf === G.player; })[0];
    var mine = G.cities.filter(function (c) { return c.owner === G.player; })[0] || cap;
    var z = Math.max(zoomLimits()[0], Math.min(1.9, vw / (4.8 * HEX * SQ3)));
    centerOn(mine.i, z, false);
    Mu.setMood(season().key, true);
    save();
    if (G.over) { showEnd(); return; }
    busy = true;
    showSeasonCard([], fresh, function () {
      if (season().monsoon) sweep = { t0: performance.now(), dur: 1400 };
      fxAt(mine.i, 'love', HC[G.player]);
      setTimeout(checkRewards, 500);
      if (fresh) { rivalsSayHello(); G.tut.coach = 'unit'; coachUpdate(); }
      else coachUpdate();
    });
    if (!fresh) $('scGo').textContent = 'Continue';
    setTimeout(function () { if (!Mu.running()) toast('Tap the speaker button to hear the music.', ''); soundIcon(); }, 1500);
  }

  // ------------------------------------------------------------ saving
  function save() { try { if (G && !G.demo && !G.over) localStorage.setItem(SAVE, JSON.stringify(G)); } catch (e) { } }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) { } }
  function loadSave() {
    try { var s = localStorage.getItem(SAVE); if (!s) return null; var g = JSON.parse(s); return g && g.v === 1 && !g.over && !g.demo ? g : null; } catch (e) { return null; }
  }
  function saveSettings() { try { localStorage.setItem(SET, JSON.stringify(settings)); } catch (e) { } }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layerDirty = true; need(); });
  function need() { needDraw = true; }
  showTitle();
  requestAnimationFrame(frame);
  window.__aintinai = {
    get G() { return G; }, get play() { return play; }, endTurn: endTurn, tapTile: function (i) { onTileTap(G.tiles[i]); }, act: act, select: select,
    skip: function () { if (play) endPlayback(); }, refresh: refresh, next: function () { nextUnit(); }, centerOn: function (i) { centerOn(i, null, false); }, busy: function () { return busy || !!play; }
  };
})();

</script>
</body>
</html>
